[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "payload-cache"
version = "0.1.0"
description = "Payload caching service and a command line client for it"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.scripts]
cache-cli = "cli.main:main"

[tool.setuptools]
packages = ["app", "cli"]

# One list of dependencies, shared with the Docker image
[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
